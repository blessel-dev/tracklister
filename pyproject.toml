[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tracklister"
version = "1.1.0.dev2"
description = "Tracklister: de una tracklist de DJ a una carpeta ordenada de audio verificado (Soulseek)."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13,<3.14"
# Exact pins live in requirements.lock.txt; this list is informational.
dependencies = [
    "PySide6_Essentials", "openpyxl", "RapidFuzz", "mutagen", "soundfile",
    "numpy", "keyring", "packaging", "requests",
]

[project.gui-scripts]
tracklister = "tracklister.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracklister = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -p no:cacheprovider"
qt_api = "pyside6"
markers = [
    "slow: synthetic-audio or subprocess heavy tests",
    "gui: needs a QApplication (offscreen)",
]
