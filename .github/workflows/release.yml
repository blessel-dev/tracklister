# Build Tracklister on Windows and on macOS, test both, and publish ONE GitHub Release when a version
# tag is pushed.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Publish from the home PC:   git tag v1.1.0   then   git push origin v1.1.0
# - The tag must be "v" + __version__ (src/tracklister/__init__.py); otherwise the job stops.
# - The GitHub owner lives in ONE place: GITHUB_OWNER in src/tracklister/config.py. When it names
#   this repository's owner the check is silent. A fork keeps it, with a warning; an old tree that
#   still has the placeholder below gets this repository's owner for this build only (nothing is
#   committed), also with a warning.
# - Everything is offline-tested first (fake engine, no network); the real engines and yt-dlp are
#   only downloaded and checked against their pinned SHA-256, never run.
#
# Three jobs:
# - windows (windows-2025): the same steps as in 1.0.x; its zip and the engines' sources go to the
#   artifact "windows-release" instead of being published here.
# - macos (macos-15, Apple Silicon): the same checks for Tracklister.app (signed ad hoc, zipped with
#   ditto, smoke-tested); its zip is uploaded as it is (archive: false), because re-zipping it would
#   lose the app's symlinks and permissions. The test totals become a notice; if a step fails, the last
#   step turns the failing tests and log lines into at most 10 error annotations, which the public API
#   shows without logging in. On a branch push, failed tests do not stop the build and the smoke test
#   (one run reports on both), but the job stays red and uploads nothing; a v* tag stays strict.
# - publish (ubuntu, after both): ONE SHA256SUMS.txt and ONE set of notes for both zips, then a single
#   `gh release create`. It is the only job that may write, and only a v* tag publishes.
#
# A push to branch "mac" is a TEST build: both builds and all their tests run, and publish is a dry
# run (it downloads both artifacts and prints SHA256SUMS.txt and the notes). It creates no Release
# and no tag, and pages.yml does not run (it only follows main). The macOS zip of a test build is
# downloaded from the run's Artifacts while logged in to GitHub.
name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - mac

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  OWNER_PLACEHOLDER: OWNER_PLACEHOLDER    # value of GITHUB_OWNER until the repo is published
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  windows:
    name: Build and test (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the tag and the GitHub owner
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: python packaging\ci_prepare.py --tag "$env:GITHUB_REF_NAME" --ref-type "$env:GITHUB_REF_TYPE" --owner "$env:GITHUB_REPOSITORY_OWNER" --repo "$env:REPO_NAME" --placeholder "$env:OWNER_PLACEHOLDER"

      - name: Create the venv from the exact pins
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --no-input -r requirements-dev.lock.txt

      - name: Fetch the pinned engines (SHA-256 verified)
        run: .\.venv\Scripts\python.exe tools\fetch_engine.py

      - name: Fetch the pinned yt-dlp (SHA-256 verified)
        run: .\.venv\Scripts\python.exe packaging\fetch_ytdlp.py

      - name: Run the tests (offline, fake engine)
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Build the app and the release files
        run: .\.venv\Scripts\python.exe packaging\build.py --zip --no-identity-scan

      - name: Smoke-test the exe without Python on PATH
        run: .\.venv\Scripts\python.exe packaging\smoke_test.py --offscreen --screenshot dist\smoke\first-run.png

      - name: Keep the Windows zip and the engines' sources for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            dist/release/Tracklister-*-win64.zip
            dist/release/*-source.zip
          if-no-files-found: error

  macos:
    name: Build and test (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Show the runner
        run: |
          sw_vers
          uname -m
          python -VV

      - name: Check the tag and the GitHub owner
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: python packaging/ci_prepare.py --tag "$GITHUB_REF_NAME" --ref-type "$GITHUB_REF_TYPE" --owner "$GITHUB_REPOSITORY_OWNER" --repo "$REPO_NAME" --placeholder "$OWNER_PLACEHOLDER"

      - name: Create the venv from the exact pins (wheels only)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-input --only-binary=:all: -r requirements-dev.lock.txt
          .venv/bin/python packaging/check_lock.py

      - name: Fetch the pinned engine (SHA-256 verified)
        run: .venv/bin/python tools/fetch_engine.py

      - name: Fetch the pinned yt-dlp (SHA-256 verified)
        run: .venv/bin/python packaging/fetch_ytdlp.py

      - name: Run the tests (offline, fake engine)
        id: tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          mkdir -p dist/ci
          .venv/bin/python -m pytest -q --junitxml=dist/ci/pytest.xml 2>&1 | tee dist/ci/pytest.log

      - name: Report the test totals (annotation)
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: python packaging/ci_annotate.py --title-prefix macOS --summary dist/ci/pytest.log --junit dist/ci/pytest.xml

      # On a branch push the app is still built and smoke-tested when only the tests failed, so one run reports
      # on both (the job stays red and nothing is uploaded). A v* tag stays strict: any failure stops here.
      - name: Build, sign and zip the app
        id: build
        if: ${{ success() || (!cancelled() && github.ref_type == 'branch' && steps.tests.outcome == 'failure') }}
        run: |
          set -o pipefail
          mkdir -p dist/ci
          .venv/bin/python packaging/build.py --zip --no-identity-scan 2>&1 | tee dist/ci/build.log

      - name: Smoke-test the app
        id: smoke
        if: ${{ success() || (!cancelled() && github.ref_type == 'branch' && steps.tests.outcome == 'failure' && steps.build.outcome == 'success') }}
        run: .venv/bin/python packaging/smoke_test_macos.py --offscreen --screenshot dist/smoke/first-run.png --json dist/ci/smoke.json

      - name: Keep the macOS zip as it is (the artifact is the zip itself)
        if: ${{ success() && steps.tests.outcome == 'success' && steps.smoke.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/release/Tracklister-*-macos-arm64.zip
          archive: false
          if-no-files-found: error

      - name: Explain the failure (annotations)
        if: failure()
        run: python packaging/ci_annotate.py --title-prefix macOS --junit dist/ci/pytest.xml --log dist/ci/pytest.log dist/ci/build.log build/pyinstaller.log --smoke dist/ci/smoke.json --max 10

  publish:
    name: Publish the Release (only a v* tag; a dry run on branch mac)
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write                     # create the Release and upload its files (tags only)
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download the Windows files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: dist/publish/in

      - name: Download the macOS zip as it was uploaded
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "Tracklister-*-macos-arm64.zip"
          skip-decompress: true
          merge-multiple: true
          path: dist/publish/in

      - name: Gather the files, one SHA256SUMS.txt and the notes
        env:
          MODE: ${{ github.ref_type == 'tag' && 'publish' || 'dry-run' }}
        run: python packaging/publish_release.py --files dist/publish/in --out dist/publish/out --notes dist/publish/release-notes.md --mode "$MODE"

      - name: Publish the GitHub Release (files + SHA256SUMS.txt)
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Only a v* tag publishes a Release (this run is $GITHUB_REF)"
            exit 1
          fi
          shopt -s nullglob
          files=(dist/publish/out/*)
          if [ "${#files[@]}" -lt 5 ]; then echo "::error::dist/publish/out is incomplete"; exit 1; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Tracklister ${TAG#v}" --notes-file dist/publish/release-notes.md
          fi
